name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-e-testes-unitarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EmailSender.slnx

      - name: Build
        run: dotnet build EmailSender.slnx --no-restore -c Release

      - name: Testes unitários
        run: >
          dotnet test EmailSender.slnx --no-build -c Release
          --filter "FullyQualifiedName!~IntegrationTests"
          --logger "trx;LogFileName=unit.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./resultados

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-unitarios
          path: resultados

  testes-de-integracao:
    runs-on: ubuntu-latest
    needs: build-e-testes-unitarios
    # SMTP de teste usado por SmtpEmailSenderTests (SMTP 1025, painel/API 8025).
    services:
      mailpit:
        image: axllent/mailpit:v1.21
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Testcontainers sobe o SQL Server via Docker (já disponível no runner).
      - name: Testes de integração
        run: >
          dotnet test tests/EmailSender.IntegrationTests/EmailSender.IntegrationTests.csproj -c Release
          --logger "trx;LogFileName=integration.trx"
          --results-directory ./resultados

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-integracao
          path: resultados
